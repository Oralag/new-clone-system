/* ─── shared primitives ───────────────────────────────────── */
function Dot({ on }) {
  return <span style={{
    display:'inline-block', width:7, height:7, borderRadius:'50%', flexShrink:0,
    background: on ? T.green : T.g400,
    boxShadow: on ? `0 0 5px ${T.green}` : 'none',
  }}/>;
}

function Badge({ children, color='#64748b', bg='rgba(100,116,139,0.1)' }) {
  return <span style={{
    fontSize:10, fontWeight:700, color, background:bg,
    padding:'2px 8px', borderRadius:99, whiteSpace:'nowrap',
  }}>{children}</span>;
}

function Btn({ children, primary, onClick, small, full }) {
  const [hover, setHover] = useState(false);
  return <button
    onClick={onClick}
    onMouseEnter={() => setHover(true)}
    onMouseLeave={() => setHover(false)}
    style={{
      padding: small ? '5px 12px' : '8px 16px',
      background: primary ? (hover ? T.tealL : T.teal) : (hover ? T.g100 : T.white),
      color: primary ? '#fff' : T.g600,
      border: `1px solid ${primary ? T.teal : T.g200}`,
      borderRadius: 9,
      fontSize: small ? 11 : 12,
      fontWeight: 700,
      cursor: 'pointer',
      transition: 'all 0.13s',
      width: full ? '100%' : undefined,
    }}
  >{children}</button>;
}

/* ─── KPI card ────────────────────────────────────────────── */
function Kpi({ label, value, sub, tone }) {
  const colors = { teal:{accent:T.teal,bg:T.tealBg}, danger:{accent:T.red,bg:T.redBg}, amber:{accent:T.amber,bg:T.amberBg}, neutral:{accent:T.g400,bg:T.g100} };
  const c = colors[tone] || colors.neutral;
  return <div style={{ flex:1, background:T.white, borderRadius:16, padding:'18px 22px', border:`1px solid ${T.g200}`, boxShadow:'0 2px 10px rgba(15,23,42,0.06)' }}>
    <div style={{ fontSize:11, fontWeight:700, color:T.g400, textTransform:'uppercase', letterSpacing:'0.06em', marginBottom:6 }}>{label}</div>
    <div style={{ fontSize:30, fontWeight:800, color:T.navy, letterSpacing:'-0.04em', lineHeight:1.1 }}>{value}</div>
    <div style={{ marginTop:6, fontSize:11, color:c.accent, fontWeight:600 }}>{sub}</div>
  </div>;
}

/* ─── Specialist card (dashboard) ────────────────────────── */
function SpecCard({ s, onWake }) {
  const tones = { warn:{c:T.amber,bg:T.amberBg}, danger:{c:T.red,bg:T.redBg}, teal:{c:T.teal,bg:T.tealBg}, neutral:{c:T.g400,bg:T.g100} };
  const t = tones[s.insightTone] || tones.neutral;
  const [h, setH] = useState(false);
  return <div style={{
    background:T.white, borderRadius:18, padding:'16px 18px',
    border:`1px solid ${T.g200}`, boxShadow:'0 2px 14px rgba(15,23,42,0.05)',
    display:'flex', flexDirection:'column', gap:12,
    transition:'box-shadow 0.18s',
    boxShadow: h ? '0 8px 30px rgba(15,23,42,0.10)' : '0 2px 14px rgba(15,23,42,0.05)',
  }}
    onMouseEnter={()=>setH(true)} onMouseLeave={()=>setH(false)}
  >
    <div style={{ display:'flex', alignItems:'center', gap:10 }}>
      <div style={{ fontSize:26, lineHeight:1, width:36, height:36, borderRadius:12, background:s.colorBg, display:'flex', alignItems:'center', justifyContent:'center' }}>{s.emoji}</div>
      <div style={{ flex:1 }}>
        <div style={{ display:'flex', alignItems:'center', gap:6 }}>
          <span style={{ fontSize:14, fontWeight:700, color:T.navy }}>{s.name}</span>
          <Dot on={s.status==='active'}/>
        </div>
        <div style={{ fontSize:11, color:T.g400, marginTop:1 }}>{s.tagline}</div>
      </div>
      <Badge color={s.status==='active'?T.teal:T.g400} bg={s.status==='active'?T.tealBg:T.g100}>{s.todayTask}</Badge>
    </div>

    <div style={{ background:t.bg, borderRadius:10, padding:'9px 12px', borderLeft:`3px solid ${t.c}` }}>
      <div style={{ fontSize:10, color:t.c, fontWeight:700, marginBottom:3 }}>最新发现</div>
      <div style={{ fontSize:12, color:T.navy, lineHeight:1.55 }}>{s.lastInsight}</div>
    </div>

    <button onClick={() => onWake(s.id)} style={{
      padding:'8px', background:T.tealBg, color:T.teal,
      border:`1px solid ${T.tealB}`, borderRadius:10,
      fontSize:12, fontWeight:700, cursor:'pointer', width:'100%',
      transition:'all 0.13s',
    }}
      onMouseEnter={e=>{e.target.style.background=T.teal;e.target.style.color='#fff';}}
      onMouseLeave={e=>{e.target.style.background=T.tealBg;e.target.style.color=T.teal;}}
    >
      叫醒 {s.name} →
    </button>
  </div>;
}

function TodoItem({ todo }) {
  const palette = { danger:{d:T.red,bg:T.redBg}, warn:{d:T.amber,bg:T.amberBg}, teal:{d:T.teal,bg:T.tealBg}, neutral:{d:T.g300,bg:T.g100} };
  const p = palette[todo.tone] || palette.neutral;
  return <div style={{ background:p.bg, borderRadius:10, padding:'9px 12px', display:'flex', gap:8, alignItems:'flex-start' }}>
    <div style={{ width:5, height:5, borderRadius:'50%', background:p.d, flexShrink:0, marginTop:5 }}/>
    <div style={{ flex:1 }}>
      <div style={{ fontSize:11, color:T.navy, lineHeight:1.5 }}>{todo.text}</div>
      <div style={{ fontSize:10, color:p.d, marginTop:2, fontWeight:700 }}>{todo.tag}</div>
    </div>
  </div>;
}

/* ─── Message bubbles (workbench) ─────────────────────────── */

}

          <Badge color={T.red} bg={T.redBg}>{msg.summary}</Badge>
        </div>
        <table style={{ width:'100%', borderCollapse:'collapse' }}>
          <thead><tr style={{ background:T.g50 }}>

            <tbody>
              {msg.items.map((it,i) => <tr key={i} style={{ borderTop:`1px solid ${T.g100}` }}>

/* ─── Workbench page ──────────────────────────────────────── */
function WorkbenchPage() {
  const [active, setActive] = useState('ops_restock');
  const spec = SPECS.find(s => s.id === active);
  const [input, setInput] = useState('');

  return <div style={{ display:'flex', height:'100%', overflow:'hidden' }}>
    {/* Spec selector */}
    <div style={{ width:70, flexShrink:0, background:T.g50, borderRight:`1px solid ${T.g200}`, display:'flex', flexDirection:'column', alignItems:'center', paddingTop:14, gap:5 }}>
      {SPECS.map(s => {
        const on = active === s.id;
        return <button key={s.id} onClick={() => setActive(s.id)} title={s.name} style={{
          width:46, height:46, borderRadius:13,
          border:`2px solid ${on ? s.color : 'transparent'}`,
          background: on ? s.colorBg : 'transparent',
          cursor:'pointer', fontSize:21,
          display:'flex', alignItems:'center', justifyContent:'center',
          position:'relative', transition:'all 0.15s',
        }}>
          {s.emoji}
          <span style={{
            position:'absolute', top:2, right:2,
            width:7, height:7, borderRadius:'50%',
            background: s.status==='active' ? T.green : T.g400,
            border:'1.5px solid #fff',
          }}/>
        </button>;
      })}
    </div>

    {/* Chat area */}
    <div style={{ flex:1, display:'flex', flexDirection:'column', minWidth:0, overflow:'hidden' }}>
      <div style={{ padding:'12px 18px', background:T.white, borderBottom:`1px solid ${T.g200}`, display:'flex', alignItems:'center', gap:12, flexShrink:0 }}>
        <div style={{ width:34, height:34, borderRadius:11, background:spec.colorBg, display:'flex', alignItems:'center', justifyContent:'center', fontSize:18 }}>{spec.emoji}</div>
        <div>
          <div style={{ fontSize:14, fontWeight:700, color:T.navy, display:'flex', alignItems:'center', gap:6 }}>{spec.name} <Dot on={spec.status==='active'}/></div>
          <div style={{ fontSize:11, color:T.g400 }}>{spec.tagline}</div>
        </div>
        <div style={{ marginLeft:'auto', fontSize:11, color:T.g400 }}>今日已处理 <strong style={{ color:T.navy }}>{active==='ops_data'?'3':active==='ops_restock'?'12':active==='ops_customer'?'8':'1'}</strong> 条任务</div>
      </div>

      <div style={{ flex:1, overflowY:'auto', padding:'18px 20px', display:'flex', flexDirection:'column', gap:14, background:'#f6f8fa' }}>
        {active === 'ops_restock' ? MSGS.map((m,i) =>
          m.role==='user' ? <UserMsg key={i} msg={m}/> :
          m.type==='stock_warning' ? <StockCard key={i} msg={m}/> :
          <DraftCard key={i} msg={m}/>
        ) : (
          <div style={{ flex:1, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', gap:10, paddingTop:60 }}>
            <div style={{ fontSize:44 }}>{spec.emoji}</div>
            <div style={{ fontSize:15, fontWeight:700, color:T.navy }}>{spec.name} 随时待命</div>
            <div style={{ fontSize:12, color:T.g400, textAlign:'center', maxWidth:280, lineHeight:1.7 }}>{spec.lastInsight}</div>
            <Badge color={spec.color} bg={spec.colorBg}>{spec.todayTask}</Badge>
            <div style={{ marginTop:8, display:'flex', gap:8 }}>
              {QUICK_TASKS.slice(0,3).map((t,i) =>
                <Btn key={i} small onClick={()=>{setInput(t.title);}}>
                  {t.emoji} {t.title}
                </Btn>
              )}
            </div>
          </div>
        )}
      </div>

      <div style={{ padding:'12px 16px', borderTop:`1px solid ${T.g200}`, background:T.white, display:'flex', gap:8, flexShrink:0 }}>
        <input value={input} onChange={e=>setInput(e.target.value)}
          placeholder={`问 ${spec.name}…`}
          style={{ flex:1, padding:'9px 14px', borderRadius:11, border:`1.5px solid ${T.g200}`, fontSize:13, outline:'none', background:T.g50, color:T.navy }}
        />
        <button style={{ padding:'9px 18px', background:T.teal, color:'#fff', border:'none', borderRadius:11, fontSize:13, fontWeight:700, cursor:'pointer' }}>发送</button>
      </div>
    </div>

    {/* Quick tasks */}
    <div style={{ width:214, flexShrink:0, borderLeft:`1px solid ${T.g200}`, padding:'14px 12px', background:T.white, overflowY:'auto' }}>
      <div style={{ fontSize:10, fontWeight:800, color:T.g400, textTransform:'uppercase', letterSpacing:'0.07em', marginBottom:10 }}>快捷任务</div>
      <div style={{ display:'flex', flexDirection:'column', gap:6 }}>
        {QUICK_TASKS.map((t,i) => {
          const [h, setH] = useState(false);
          return <button key={i} onClick={()=>setInput(t.title)}
            onMouseEnter={()=>setH(true)} onMouseLeave={()=>setH(false)}
            style={{ padding:'9px 11px', background: h ? T.tealBg : T.g50, border:`1px solid ${h ? T.tealB : T.g200}`, borderRadius:11, textAlign:'left', cursor:'pointer', transition:'all 0.13s' }}>
            <div style={{ fontSize:12, fontWeight:700, color: h ? T.teal : T.navy }}>{t.emoji} {t.title}</div>
            <div style={{ fontSize:10, color:T.g400, marginTop:2, lineHeight:1.4 }}>{t.desc}</div>
          </button>;
        })}
      </div>

      <div style={{ marginTop:14, paddingTop:14, borderTop:`1px solid ${T.g200}` }}>
        <div style={{ fontSize:10, fontWeight:800, color:T.g400, textTransform:'uppercase', letterSpacing:'0.07em', marginBottom:8 }}>Captain 统筹</div>
        <button style={{ width:'100%', padding:'9px 11px', background:T.navy, color:'#fff', border:'none', borderRadius:11, fontSize:11, fontWeight:700, cursor:'pointer', textAlign:'left' }}>
          🧭 多专员协作任务
        </button>
        <div style={{ marginTop:7, fontSize:10, color:T.g400, lineHeight:1.55 }}>
          涉及多专员协作（如完整活动策划），交给 Captain 分配流水线。
        </div>
      </div>
    </div>
  </div>;
}

/* ─── Platforms page ──────────────────────────────────────── */
function PlatformsPage() {
  const stLc = { '待发货':T.amber, '已发货':T.teal, '待审核':T.red, '已完成':T.g400 };
  const wLc  = { critical:T.red, danger:T.amber, warn:T.g400 };
  return <div style={{ padding:'22px 26px', display:'flex', flexDirection:'column', gap:22, height:'100%', overflowY:'auto' }}>
    {/* Platform grid */}
    <div>
      <div style={{ fontSize:14, fontWeight:800, color:T.navy, marginBottom:12 }}>平台接入管理</div>
      <div style={{ display:'grid', gridTemplateColumns:'repeat(3, 1fr)', gap:10 }}>
        {PLATFORMS.map(p => <div key={p.id} style={{ background:T.white, borderRadius:14, border:`1px solid ${T.g200}`, padding:'14px 16px', display:'flex', alignItems:'center', gap:12 }}>
          <div style={{ width:40, height:40, borderRadius:10, background:p.color+'18', display:'flex', alignItems:'center', justifyContent:'center', fontSize:20, flexShrink:0 }}>{p.emoji}</div>
          <div style={{ flex:1 }}>
            <div style={{ fontSize:13, fontWeight:700, color:T.navy }}>{p.name}</div>
            <div style={{ fontSize:10, color:T.g400, marginTop:1 }}>未接入 · Phase 2 接入</div>
          </div>
          <Btn small>接入</Btn>
        </div>)}
      </div>
      <div style={{ marginTop:12, padding:'11px 16px', background:T.tealBg, borderRadius:11, fontSize:12, color:T.teal, lineHeight:1.6 }}>
        💡 建议优先接入<strong>拼多多</strong>（开放程度最高），接入后可自动拉取订单并同步 ERP 库存。
      </div>
    </div>

    {/* ERP data grid */}
    <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:16 }}>
      {/* Stock warnings */}
      <div style={{ background:T.white, borderRadius:16, border:`1px solid ${T.g200}`, overflow:'hidden' }}>
        <div style={{ padding:'13px 18px', borderBottom:`1px solid ${T.g100}`, display:'flex', justifyContent:'space-between', alignItems:'center' }}>
          <span style={{ fontSize:13, fontWeight:700, color:T.navy }}>ERP 库存预警</span>
          <Badge color={T.red} bg={T.redBg}>12 项预警</Badge>
        </div>
        <div>
          {STOCK_WARNS.map((w,i) => <div key={i} style={{ padding:'10px 18px', display:'flex', alignItems:'center', gap:10, borderBottom: i<STOCK_WARNS.length-1 ? `1px solid ${T.g100}` : 'none' }}>
            <div style={{ width:5, height:5, borderRadius:'50%', background:wLc[w.l]||T.g400, flexShrink:0 }}/>
            <span style={{ flex:1, fontSize:12, color:T.navy }}>{w.name}</span>
            <span style={{ fontSize:13, fontWeight:800, color:wLc[w.l]||T.g400 }}>{w.stock}</span>
            <span style={{ fontSize:11, color:T.g400 }}>/ {w.min}</span>
          </div>)}
        </div>
        <div style={{ padding:'10px 18px', borderTop:`1px solid ${T.g100}` }}>
          <button style={{ fontSize:12, color:T.teal, background:'none', border:'none', cursor:'pointer', fontWeight:700 }}>→ 前往库存预警页</button>
        </div>
      </div>

      {/* Recent orders */}
      <div style={{ background:T.white, borderRadius:16, border:`1px solid ${T.g200}`, overflow:'hidden' }}>
        <div style={{ padding:'13px 18px', borderBottom:`1px solid ${T.g100}`, display:'flex', justifyContent:'space-between', alignItems:'center' }}>
          <span style={{ fontSize:13, fontWeight:700, color:T.navy }}>ERP 最近订单</span>
          <Badge color={T.g400} bg={T.g100}>来自销售合同</Badge>
        </div>
        <div>
          {ORDERS.map((o,i) => <div key={i} style={{ padding:'10px 18px', display:'flex', alignItems:'center', gap:10, borderBottom: i<ORDERS.length-1 ? `1px solid ${T.g100}` : 'none' }}>
            <div style={{ flex:1 }}>
              <div style={{ fontSize:10, color:T.g400 }}>{o.no}</div>
              <div style={{ fontSize:12, color:T.navy, fontWeight:600 }}>{o.cust}</div>
            </div>
            <div style={{ textAlign:'right' }}>
              <div style={{ fontSize:13, fontWeight:800, color:T.navy }}>{o.amt}</div>
              <div style={{ fontSize:10, fontWeight:700, color:stLc[o.st]||T.g400 }}>{o.st}</div>
            </div>
            <div style={{ fontSize:10, color:T.g400, width:32, textAlign:'right' }}>{o.t}</div>
          </div>)}
        </div>
        <div style={{ padding:'10px 18px', borderTop:`1px solid ${T.g100}` }}>
          <button style={{ fontSize:12, color:T.teal, background:'none', border:'none', cursor:'pointer', fontWeight:700 }}>→ 前往销售合同页</button>
        </div>
      </div>
    </div>
  </div>;
}

/* ─── Sidebar ─────────────────────────────────────────────── */
const NAV = [
  { id:'dashboard',  emoji:'🏠', label:'指挥台'    },
  { id:'workbench',  emoji:'🤖', label:'运营工作台'  },
  { id:'platforms',  emoji:'🔗', label:'平台接入'   },
];

function Sidebar({ active, onNav }) {
  return <div style={{ width:198, flexShrink:0, background:T.navy, display:'flex', flexDirection:'column', height:'100%' }}>
    {/* Logo */}
    <div style={{ padding:'18px 14px 14px', borderBottom:'1px solid rgba(255,255,255,0.07)' }}>
      <div style={{ display:'flex', alignItems:'center', gap:10 }}>
        <div style={{ width:32, height:32, borderRadius:9, background:T.teal, display:'flex', alignItems:'center', justifyContent:'center', fontSize:16 }}>🧭</div>
        <div>
          <div style={{ fontSize:13, fontWeight:800, color:'#fff' }}>运营指挥台</div>
          <div style={{ fontSize:10, color:'rgba(255,255,255,0.35)', marginTop:1 }}>AI 运营专员团队</div>
        </div>
      </div>
    </div>

    {/* Nav */}
    <nav style={{ flex:1, padding:'9px 7px', display:'flex', flexDirection:'column', gap:2 }}>
      {NAV.map(item => {
        const on = active === item.id;
        return <button key={item.id} onClick={() => onNav(item.id)} style={{
          display:'flex', alignItems:'center', gap:9,
          padding:'9px 10px', borderRadius:10, border:'none',
          background: on ? 'rgba(13,148,136,0.22)' : 'transparent',
          color: on ? T.tealL : 'rgba(255,255,255,0.5)',
          fontSize:13, fontWeight: on ? 700 : 500,
          cursor:'pointer', textAlign:'left', width:'100%',
          transition:'all 0.13s',
          boxShadow: on ? `inset 0 0 0 1px rgba(13,148,136,0.28)` : 'none',
        }}
          onMouseEnter={e => { if (!on) e.currentTarget.style.background='rgba(255,255,255,0.05)'; }}
          onMouseLeave={e => { if (!on) e.currentTarget.style.background='transparent'; }}
        >
          <span style={{ fontSize:15 }}>{item.emoji}</span>
          {item.label}
        </button>;
      })}

      {/* Specialist shortcuts */}
      <div style={{ marginTop:14, padding:'10px 10px 6px', borderTop:'1px solid rgba(255,255,255,0.06)' }}>
        <div style={{ fontSize:10, color:'rgba(255,255,255,0.25)', marginBottom:8, textTransform:'uppercase', letterSpacing:'0.07em', fontWeight:700 }}>运营专员</div>
        {SPECS.map(s => <div key={s.id} style={{ display:'flex', alignItems:'center', gap:7, padding:'5px 4px', cursor:'pointer', borderRadius:7 }}
          onMouseEnter={e=>e.currentTarget.style.background='rgba(255,255,255,0.04)'}
          onMouseLeave={e=>e.currentTarget.style.background='transparent'}
        >
          <span style={{ fontSize:13 }}>{s.emoji}</span>
          <span style={{ fontSize:11, color:'rgba(255,255,255,0.4)' }}>{s.name}</span>
          <span style={{ marginLeft:'auto', width:6, height:6, borderRadius:'50%', background: s.status==='active' ? T.green : T.g500, flexShrink:0 }}/>
        </div>)}
      </div>
    </nav>

    {/* Footer */}
    <div style={{ padding:'10px 8px 14px', borderTop:'1px solid rgba(255,255,255,0.06)' }}>
      <div style={{ padding:'10px 12px', background:'rgba(13,148,136,0.1)', borderRadius:10, marginBottom:7 }}>
        <div style={{ fontSize:10, fontWeight:800, color:T.tealL, marginBottom:3 }}>Phase 1 模式</div>
        <div style={{ fontSize:10, color:'rgba(255,255,255,0.35)', lineHeight:1.55 }}>数据来自 ERP，接入平台 API 后自动升级为实时模式。</div>
      </div>
      <button style={{ display:'flex', alignItems:'center', gap:7, padding:'7px 9px', width:'100%', background:'transparent', border:'none', color:'rgba(255,255,255,0.3)', fontSize:11, cursor:'pointer', borderRadius:8, textAlign:'left' }}>
        ← 返回 ERP 主界面
      </button>
    </div>
  </div>;
}

/* ─── App ─────────────────────────────────────────────────── */
function App() {
  const [page, setPage] = useState('dashboard');
  function wakeSpec(id) { setPage('workbench'); }
  const pageNames = { dashboard:'指挥台', workbench:'运营工作台', platforms:'平台接入' };
  const pageSubs  = { dashboard:'今日运营全局视图', workbench:'与 AI 专员协作处理运营任务', platforms:'平台连接与 ERP 现有数据' };

  return <div style={{ display:'flex', height:'100vh', overflow:'hidden' }}>
    <Sidebar active={page} onNav={setPage}/>

    <div style={{ flex:1, overflow:'hidden', display:'flex', flexDirection:'column' }}>
      {/* Top bar */}
      <div style={{ height:50, flexShrink:0, background:T.white, borderBottom:`1px solid ${T.g200}`, display:'flex', alignItems:'center', padding:'0 22px', gap:12 }}>
        <div style={{ flex:1 }}>
          <span style={{ fontSize:14, fontWeight:800, color:T.navy }}>{pageNames[page]}</span>
          <span style={{ fontSize:12, color:T.g400, marginLeft:8 }}>{pageSubs[page]}</span>
        </div>
        <div style={{ display:'flex', alignItems:'center', gap:8 }}>
          <span style={{ fontSize:11, color:T.g400 }}>2026-05-09</span>
          <Badge color={T.amber} bg={T.amberBg}>Phase 1 · ERP 数据模式</Badge>
        </div>
      </div>

      {/* Page */}
      <div style={{ flex:1, overflow:'hidden', background:T.g50 }}>
        {page==='dashboard'  && <DashboardPage onWake={wakeSpec}/>}
        {page==='workbench'  && <WorkbenchPage/>}
        {page==='platforms'  && <PlatformsPage/>}
      </div>
    </div>
  </div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
