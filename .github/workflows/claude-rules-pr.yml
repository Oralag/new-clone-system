name: Claude Rules PR

# 当任何人提交包含 CLAUDE.md 修改的 commit 时，
# 自动开一个 PR 让团队 review，防止规则被随意覆盖。

on:
  push:
    branches-ignore:
      - main
    paths:
      - 'CLAUDE.md'

  # 也可以手动触发
  workflow_dispatch:

jobs:
  open-rules-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed rules summary
        id: diff
        run: |
          DIFF=$(git diff origin/main -- CLAUDE.md | head -80)
          echo "diff<<EOF" >> $GITHUB_OUTPUT
          echo "$DIFF" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create or update PR
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "docs: 更新 CLAUDE.md 团队规范"
          body: |
            ## Claude 规范文档更新

            有团队成员修改了 `CLAUDE.md`，请 review 后合并。

            ### 变更摘要
            ```diff
            ${{ steps.diff.outputs.diff }}
            ```

            ### 合并前请确认
            - [ ] 新增规则描述准确，不会误导 Claude
            - [ ] 纠错记录已注明日期和错误原因
            - [ ] 没有泄露敏感信息（密码、token 等）

            ---
            *由 GitHub Actions 自动创建 · 团队共同维护 Claude 规范*
          branch: claude-rules-update
          base: main
          labels: documentation,claude-rules
          draft: false
