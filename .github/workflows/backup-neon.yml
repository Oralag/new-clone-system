name: Daily Neon DB Backup

on:
  schedule:
    - cron: '0 18 * * *'  # 每天 UTC 18:00 = 北京时间 02:00
  workflow_dispatch:       # 支持手动触发

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.BACKUP_GH_TOKEN }}

      - name: Install pg_dump
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          sudo sh -c 'echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17

      - name: Run pg_dump
        env:
          NEON_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          mkdir -p backups/db
          DATE=$(date +%Y%m%d_%H%M%S)
          /usr/lib/postgresql/17/bin/pg_dump "$NEON_URL" -F p --no-password > "backups/db/neon_backup_$DATE.sql"
          test -s "backups/db/neon_backup_$DATE.sql"
          echo "BACKUP_FILE=neon_backup_$DATE.sql" >> $GITHUB_ENV

      - name: Keep only last 30 backups
        run: |
          cd backups/db
          ls -t neon_backup_*.sql 2>/dev/null | tail -n +31 | xargs rm -f || true

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backups/db/
          git commit -m "db backup ${{ env.BACKUP_FILE }}" || echo "nothing to commit"
          git push
