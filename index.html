<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/nomad-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1a2332" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="数字游牧" />
    <link rel="apple-touch-icon" href="/icons/icon-152x152.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192x192.png" />
    <title>数字游牧ERP</title>
    <script>
      // 注销所有旧的 Service Worker，防止缓存导致白屏
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          regs.forEach(function(reg) { reg.unregister() })
        })
        caches.keys().then(function(keys) {
          keys.forEach(function(key) { caches.delete(key) })
        })
      }
    </script>
    <style>
      #app-loading {
        position: fixed; inset: 0;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        background: linear-gradient(135deg, #5B4FE8 0%, #4338CA 40%, #3730A3 100%);
        z-index: 9999;
        transition: opacity 0.4s ease;
      }
      #app-loading.fade-out { opacity: 0; pointer-events: none; }
      .app-loading-logo {
        width: 72px; height: 72px;
        border-radius: 18px;
        background: rgba(255,255,255,0.12);
        display: flex; align-items: center; justify-content: center;
        margin-bottom: 22px;
        box-shadow: 0 8px 32px rgba(0,0,0,0.25);
        backdrop-filter: blur(8px);
      }
      .app-loading-title {
        color: #fff; font-size: 20px; font-weight: 700;
        font-family: system-ui, -apple-system, sans-serif;
        margin-bottom: 6px; letter-spacing: 0.5px;
      }
      .app-loading-sub {
        color: rgba(255,255,255,0.55); font-size: 13px;
        font-family: system-ui, -apple-system, sans-serif;
        margin-bottom: 36px;
      }
      .app-loading-bar {
        width: 160px; height: 2px;
        background: rgba(255,255,255,0.15); border-radius: 99px; overflow: hidden;
      }
      .app-loading-bar-inner {
        height: 100%; width: 40%;
        background: rgba(255,255,255,0.8);
        border-radius: 99px;
        animation: bar-slide 1.6s ease-in-out infinite;
      }
      @keyframes bar-slide {
        0%   { transform: translateX(-150%); }
        100% { transform: translateX(400%); }
      }
    </style>
  </head>
  <body>
    <div id="app-loading">
      <div class="app-loading-logo">
        <svg width="44" height="44" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="36" height="36" rx="8" fill="url(#nbg)"/>
          <text x="17" y="27" text-anchor="middle" font-family="'Helvetica Neue','Arial',sans-serif" font-size="26" font-weight="800" fill="#70C1F2">N</text>
          <circle cx="27" cy="8" r="4" fill="#F19D38"/>
          <defs>
            <linearGradient id="nbg" x1="0" y1="0" x2="0" y2="36" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#1C2B48"/>
              <stop offset="100%" stop-color="#1D3974"/>
            </linearGradient>
          </defs>
        </svg>
      </div>
      <div class="app-loading-title">数字游牧 ERP</div>
      <div class="app-loading-sub">正在加载...</div>
      <div class="app-loading-bar"><div class="app-loading-bar-inner"></div></div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
    <script>
      // 兜底：无论 Vue 是否报错，最多 5 秒强制移除骨架屏
      setTimeout(function() {
        var el = document.getElementById('app-loading');
        if (!el) return;
        el.style.transition = 'opacity 0.3s';
        el.style.opacity = '0';
        setTimeout(function() { el && el.parentNode && el.parentNode.removeChild(el); }, 350);
      }, 5000);
    </script>
  </body>
</html>
